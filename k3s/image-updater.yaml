apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: botwhy
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: botwhy
      images:
        - alias: frontend
          imageName: jeanmichelbb/oci-frontend
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: "regexp:^[0-9a-f]{40}$"
          manifestTargets:
            kustomize:
              name: jeanmichelbb/oci-frontend
        - alias: backend
          imageName: jeanmichelbb/oci-backend
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: "regexp:^[0-9a-f]{40}$"
          manifestTargets:
            kustomize:
              name: jeanmichelbb/oci-backend
      writeBackConfig:
        method: "git:secret:argocd/git-creds-github"
        gitConfig:
          branch: main
          writeBackTarget: "kustomization:."
